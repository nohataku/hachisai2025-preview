<!DOCTYPE html>
<html lang="ja">

<!--head部分 ブラウザの上のタブのやつ-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/hachisai.css" rel="stylesheet">
    <script src="script/auth.js"></script>
    <meta name="author" content="工学院大学学園祭実行委員会八王子祭実行部">
    <meta name="description" content="第63回八王子祭の公式ホームページです。2025年9月6日(土)・7日(日)に開催される学園祭の情報をお届けします。">
    <meta name="keywords" content="八王子祭, 学園祭, 工学院大学, 2025年">
    <title>第63回八王子祭</title>
    <link rel="icon" type="image/png" href="photo/MainLogo.PNG">
    <style>
        body.auth-hidden { display: none !important; }
        /* 初期状態でもbodyを非表示 */
        body { display: none; }
        body:not(.auth-hidden) { display: block; }
    </style>
</head>
<!--head部分 ブラウザの上のタブのやつ 終-->

<!--header部分-->
<div id="header-include"></div>
<!--header部分 終-->

<!--body部分-->
<body class="auth-hidden">
<div class="back">
    <main>
        <h1 class="page-title">教室での展示</h1>
        <section class="exhibit-content highlight-card">
          <h2>展示内容</h2>
          <div class="exhibit-text">
            <p>八王子祭では、工学院大学の各学部やサークルが教室で様々な展示を行います。学生たちの研究成果や作品を間近で見ることができる貴重な機会です。</p>
          </div>
        </section>
    </main>
</div>

<script src="script/include.js"></script>
<script src="script/hamburger.js"></script>
<script>
    // 認証済みならbodyを表示
    document.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('authenticated') === 'true') {
            document.body.style.display = '';
        }
    });
</script>
</body>
<!--body部分 終-->

<!--footer部分-->
<div id="footer-include"></div>
<!--footer部分 終-->

<!-- ロケットボタン -->
<div id="rocket-include"></div>

</html>

<body>
<div class="back">
    <main>
        <h1 class="page-title">アクセス</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; justify-content: center; margin-bottom: 24px;">
            <div style="flex: 1 1 320px; min-width: 280px; max-width: 520px;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3240.7484404834154!2d139.31548117526026!3d35.68319567258661!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60191efbf4760a57%3A0xeac22d357c022101!2z5bel5a2m6Zmi5aSn5a2mIOWFq-eOi-WtkOOCreODo-ODs-ODkeOCuQ!5e0!3m2!1sja!2sjp!4v1748760997378!5m2!1sja!2sjp" width="100%" height="250" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div style="flex: 1 1 320px; min-width: 260px; max-width: 520px;">
                <section class="access-info">
                    <h2 style="font-size:1.3rem; margin-bottom: 8px; border-left: 4px solid #40b8f0; padding-left: 8px;">アクセス方法</h2>
                    <ul style="padding-left: 1.2em; margin: 0;">
                        <li><b>JR（中央線・横浜線・八高線）「八王子駅」</b>
                            <ul>
                                <li>北口バス乗り場15番から西東京バス（直通）で15分「工学院大学」下車</li>
                                <li>北口バス乗り場6番から西東京バスで20分「工学院大学」または「工学院大学西」下車</li>
                            </ul>
                        </li>
                        <li><b>京王線「京王八王子駅」</b>
                            <ul>
                                <li>バス乗り場3番から西東京バスで25分「工学院大学西」下車</li>
                            </ul>
                        </li>
                        <li><b>JR（青梅線・五日市線・八高線）・西武拝島線「拝島駅」</b>
                            <ul>
                                <li>南口バス乗り場3番から西東京バスで25分「工学院大学」下車</li>
                            </ul>
                        </li>
                    </ul>
                </section>
            </div>
        </div>
    </main>
</div>

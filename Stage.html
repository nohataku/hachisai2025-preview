    <style>
        body.auth-hidden { display: none !important; }

<!--header部分-->
<div id="header-include"></div>

<!--body部分-->
<body class="stage-page">
<div class="back">
    <main>
        <h1 class="page-title">ステージ企画</h1>
        <div class="stage-content">
            <div class="loading">ステージ企画情報を読み込み中...</div>
        </div>

            <!-- スケジュール情報 -->
            <section class="stage-schedule-section">
                <h2>開催スケジュール</h2>
                <div class="schedule-info">
                    <div class="schedule-item">
                        <span class="schedule-date">2025年9月6日（土）</span>
                        <span class="schedule-details">各ステージ企画を順次開催予定</span>
                    </div>
                    <div class="schedule-item">
                        <span class="schedule-date">2025年9月7日（日）</span>
                        <span class="schedule-details">各ステージ企画を順次開催予定</span>
                    </div>
                    <p class="schedule-note">詳細なタイムスケジュールは後日発表いたします。</p>
                </div>
            </section>

            <!-- 注意事項 -->
            <section class="stage-attention-section">
                <h2>注意事項</h2>
                <div class="attention-content">
                    ・各ステージ企画の詳細なスケジュールは後日発表いたします。<br>
                    ・天候や諸事情により、内容やスケジュールが変更になる場合があります。<br>
                    ・観覧中は他の方のご迷惑となる行為はお控えください。<br>
                    ・撮影・録音についてはスタッフの指示に従ってください。<br>
                    ・最新情報は公式SNSでお知らせします。<br>
                </div>
                <div class="stage-hachi">工学院大学 学園祭実行委員会 八王子祭実行部</div>
            </section>
        </div>
    </main>
</div>

<script src="script/include.js"></script>
